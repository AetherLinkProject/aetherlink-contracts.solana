[package]
name = "oracle"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "oracle"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
solana-program = "2.2.1"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2.16"
solana-sdk = "2.2.1"
zeroize = "1.3.0"
solana-transaction = "2.2.1"

[dev-dependencies]
anchor-client = "0.29.0"
rand = "0.8"
solana-client = "2.2.1"
once_cell = "1.18"
serial_test = "2.0"
tokio = { version = "1.32", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
base64ct = "1.5.1"
litemap = "0.7.3"
zerofrom = "0.1.4"
secp256k1 = { version = "0.28", features = ["rand", "hashes"] }